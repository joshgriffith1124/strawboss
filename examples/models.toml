# Named model configs workers bind to (~/.strawboss/models.toml).
# Workers and the UI reference these by name only — hardware stays invisible.
# File order is preference order: the supervisor is told to favor earlier
# entries, so list the preferred model first.
#
# endpoint = harness-dependent: for opencode, the `opencode serve` base URL
#            (opencode runs locally; the GX10 inference endpoints live behind
#            opencode's provider config in ~/.config/opencode/opencode.json);
#            for dsh, the OpenAI-compatible LLM base URL the worker talks to
#            directly. See docs/NOTES.md.
# model    = opencode: "provider/model" ref · dsh: the wire model id.

[models.deepseek-flash]
endpoint = "http://127.0.0.1:4477"
model = "spark-a/deepseek-v4-flash"   # defined in opencode.json; needs the model loaded in
                                      # sglang on the GX10 before delegations to it succeed

[models.qwen-coder]
endpoint = "http://127.0.0.1:4477"
model = "spark-a/qwen3.8-27b"
harness = "opencode"             # optional; "opencode" is the default and only v1 harness
# variant = "non-thinking"       # optional opencode model variant — reasoning models can
#                                # exhaust their whole output budget thinking; a non-thinking
#                                # variant (if the provider defines one) avoids that

[models.qwen-flash]
endpoint = "http://127.0.0.1:4477"
model = "spark-a/qwen3.8-flash-next"

[models.deepseek-dsh]
endpoint = "http://gx10-52e4.attlocal.net:8000/v1"  # the LLM endpoint itself — dsh needs no opencode
model = "deepseek-v4-flash"
harness = "dsh"                  # DeepSeek Harness ACP workers; setup in docs/NOTES.md
# api_key = "local"              # sent to the endpoint; "local" when omitted
# tools_mode = "native"          # dsh tool transport: native (default) · code (one
#                                # run_code tool + ~4k-token TS SDK prompt) · both

# dsh is model-agnostic — any id the OpenAI-compatible endpoint serves works:
[models.qwen-dsh]
endpoint = "http://gx10-52e4.attlocal.net:8000/v1"
model = "qwen3.8-27b"            # sglang model id, not an opencode provider/model ref
harness = "dsh"
