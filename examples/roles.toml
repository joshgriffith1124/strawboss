# Worker roles and pipelines (~/.strawboss/roles.toml). Optional: without
# this file, delegation works exactly as before.
#
# A role is a focus for one task: a prompt preamble, a default model, and
# whether the role may edit files. The supervisor only hears about roles
# while the roles mode is on — ctrl+r in the TUI toggles it; config.toml
# [roles] mode = "on" (or `strawboss --roles on`) sets the starting state.
# `strawboss delegate --role <name>` and `--pipeline <name>` work either
# way.
#
# Role keys:
#   description  one-line routing hint the supervisor chooses by
#   prompt       preamble prepended to the task (or prompt_file = "x.md",
#                relative to this file)
#   model        default model config name from models.toml, or
#   tier         default tier (first model in that tier); an explicit
#                --model on the task overrides both
#   read_only    the role reports and must not edit: a read-only worker
#                that changed files fails and its edits are reverted
#
# A pipeline chains roles inside ONE delegate call: the steps run in order
# in the task's working directory (no branch to merge), each step's full
# report is handed to the next, and the supervisor reads one terse result.
# fix_rounds > 0 makes every read-only step that follows a writing step a
# GATE (reviewer, security, …): it must end its reply with "VERDICT: PASS"
# or "VERDICT: CHANGES"; CHANGES sends its findings back to the nearest
# writing step before it, then the gate re-checks — up to fix_rounds times
# per gate. A gate still requesting changes fails the pipeline. Read-only
# steps before any writer (architect) only plan. Each step's tile shows
# its place: "w906 coder · feature 2/3", "· feature fix 1 · security".
#
# Every step is a full worker run, and a pipeline costs several of them —
# measure with `strawboss stats --by-role` before making one the default.

[roles.architect]
description = "plans a change: files to touch, interfaces, risks, test plan — no code"
read_only = true
tier = 2
prompt = """
Read the code the task touches and write a concrete implementation plan:
the files to change and why, new functions or types with their
signatures, edge cases, and how to test it. Keep it short enough for a
small model to follow. Do not write the implementation."""

[roles.coder]
description = "implements a task or a plan; writes the tests that prove it"
tier = 2
prompt = """
Implement the task. When an earlier step left a plan, follow it unless the
code proves it wrong — then say what you changed and why. Add or update
tests for what you change, and keep the diff focused."""

[roles.reviewer]
description = "reviews the working-tree diff for bugs, missed requirements and missing tests"
read_only = true
tier = 2
prompt = """
Review the uncommitted changes (run `git diff`) against the task and any
plan. Report only real problems: bugs, unhandled cases, requirements the
change misses, missing tests. Order findings by severity and point at file
and line. Style nits are not findings."""

[roles.qa]
description = "exercises the change: runs and extends tests, reports failures"
tier = 2
prompt = """
Verify the change works: run the project's tests, add focused tests for
cases the change should handle, and fix only test code. Report what you
ran, what passed, and anything that fails with its output."""

# A frontier-model role: `model` names a claude-harness entry from
# models.toml (see examples/models.toml). Runs are metered — this is the
# only way the supervisor reaches such a model. Uncomment with that entry.
# [roles.security]
# description = "audits the change for vulnerabilities: injection, authz, secrets, unsafe input"
# read_only = true
# model = "opus"
# prompt = """
# Audit the uncommitted changes (run `git diff`) for security problems:
# injection, missing authorization, secrets in code or logs, unsafe handling
# of external input. Report each finding with file, line, severity and a
# concrete fix. Say so plainly when there is nothing to report."""
#
# Point architect at it too to plan on the frontier model:
#   [roles.architect] … model = "opus"

[pipelines.feature]
description = "non-trivial features: plan, implement, review with one fix round"
steps = ["architect", "coder", "reviewer"]
fix_rounds = 1

[pipelines.fix]
description = "bug fixes: implement, then review with one fix round"
steps = ["coder", "reviewer"]
fix_rounds = 1

# With the security role enabled: security and the reviewer are both gates,
# each with its own fix round.
