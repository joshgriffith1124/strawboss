# Strawboss dsh worker composition — minimal leaf config for the
# dsh-acp-demo bin, generated by strawboss into the dsh acp profile dir
# (plugin specifiers resolve relative to this file — docs/NOTES.md). Edit
# freely; strawboss only writes it when missing. Env-parameterized per
# spawn: STRAWBOSS_LLM_BASE_URL (OpenAI-compatible endpoint),
# STRAWBOSS_DSH_MODEL, STRAWBOSS_DSH_SESSIONS, STRAWBOSS_LLM_API_KEY.
#
# sandbox danger-full-access + approval never is deliberate: "never" means
# never ASK (auto-reject), so anything short of full access would fail
# unattended — the same never-block rule the supervisor lives under.

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    baseURL: !!js process.env.STRAWBOSS_LLM_BASE_URL
    apiKeyEnv: STRAWBOSS_LLM_API_KEY
    thinking: enabled
    # 'off' keeps reasoning_effort OFF the wire: the adapter only knows
    # off|low|high|max while sglang accepts xhigh|medium|low — any value
    # but 'low' is a 400 from one side or the other (docs/NOTES.md). The
    # server's own default effort still applies.
    reasoningEffort: !!js process.env.STRAWBOSS_DSH_REASONING ?? 'off'
    maxTokens: !!js "Number(process.env.STRAWBOSS_DSH_MAXTOKENS ?? 16384)"
    models: []

- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'

- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: danger-full-access
    workspaceRoot: !!js process.cwd()

- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: bash
  name: '@deepseek-ai/dsh-bash-sandbox'
  config:
    timeoutMs: 120000

- id: approval
  name: '@deepseek-ai/dsh-user-approval'
  config:
    policy: never

- id: acp-agent
  name: '@deepseek-ai/dsh-acp-demo'
  config:
    provider: deepseek-official
    model: !!js process.env.STRAWBOSS_DSH_MODEL
    persistenceRoot: !!js process.env.STRAWBOSS_DSH_SESSIONS ?? './.sessions'
    persistenceCompression: none
    # Unpacked chunks: each streamed delta lands in session.jsonl as its
    # own line IMMEDIATELY. With packing (the default) deltas buffer until
    # a block completes, so the TUI transcript sits empty through a whole
    # reasoning stretch — workers look dead while they think.
    packChunks: false
    workspaceContext:
      maxBytes: 65536
    # Tool transport per spawn (models.toml tools_mode): native tools,
    # code (one run_code tool + a ~15KB generated TypeScript SDK prompt),
    # or both. Native is the default — the SDK prompt is heavy for small
    # local models.
    tools:
      mode: !!js process.env.STRAWBOSS_DSH_TOOLS_MODE ?? 'native'
    persona: |
      You are a coding worker executing one delegated task. Your working directory is {{cwd}}. Complete the task, verify by running the code or tests, and reply with a brief factual summary.

- id: fs-sandbox
  name: '@deepseek-ai/dsh-fs-sandbox'
  config:
    cwd: !!js process.cwd()

- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

# ctx.codeRuntime for code/both mode; inert under native (verified).
- id: code-runtime
  name: '@deepseek-ai/dsh-code-runtime-worker-thread'

# Advisory loop-breaker: escalating in-context reminders when the model
# repeats the same tool call with identical arguments. Never blocks a
# call. The harness's hard loop abort sits above the last threshold, so
# the model gets every reminder before strawboss pulls the plug.
- id: repeat-tool-reminder
  name: '@deepseek-ai/dsh-repeat-tool-reminder'
  config:
    thresholds: [3, 5, 8]
