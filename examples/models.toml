# Worker model configs (~/.strawboss/models.toml). Workers and the UI
# reference these by name only. File order is preference order: the
# supervisor is told to favor the first entry.
#
# Tiers (optional). Give entries a `tier` to run a capability ladder instead
# of a flat list: 1 = cheapest/fastest, higher = stronger and slower. The
# supervisor is told to pick the LOWEST tier whose `description` fits the
# task, and a failed task escalates once to the next tier up (never to a
# same-tier sibling). `description` is the one-line routing hint the
# supervisor chooses by — say what the model is good for and how big a
# task it can carry. Once any entry sets a tier, entries without one are
# tier 1.
#
# The supervisor may name a model per task, or pass `--model auto` (the
# default) and let strawboss score each task onto a tier. Either way a
# model that is unreachable or not loaded is routed around — same-tier
# sibling first, then the next tier up — so listing a model that is only
# sometimes running is safe. A small fast model in front of a big one:
#
#   [models.fast-local]
#   endpoint = "http://127.0.0.1:8080/v1"
#   model = "your-small-model"
#   harness = "dsh"
#   tier = 1
#   description = "fast and small: single-function edits, renames, test stubs, shell chores"
#
#   [models.qwen-dsh]
#   ...
#   tier = 2
#   description = "stronger, slower: multi-file changes, new packages, debugging"
#
# Two harness flavors, one entry each below. README "Worker harness
# setup" walks the prerequisites; docs/NOTES.md has the deep findings.

# ── opencode harness ────────────────────────────────────────────────────
# endpoint = the local `opencode serve` URL (strawboss spawns the server
#            itself for localhost endpoints; your inference host lives in
#            opencode's provider config, ~/.config/opencode/opencode.json).
# model    = opencode "provider/model" ref matching that config.
[models.qwen-coder]
endpoint = "http://127.0.0.1:4477"
model = "local/qwen3.8-27b"
harness = "opencode"          # optional here — opencode is the default
# variant = "non-thinking"    # opencode model variant, if the provider
#                             # defines one (reasoning models can burn the
#                             # whole output budget thinking)

# ── dsh harness (DeepSeek Harness) ──────────────────────────────────────
# endpoint = your OpenAI-compatible inference URL directly — no opencode
#            in the path.
# model    = the id the server serves (see <endpoint>/models).
[models.qwen-dsh]
endpoint = "http://your-inference-host:8000/v1"
model = "qwen3.8-27b"
harness = "dsh"
# api_key = "local"           # sent to the endpoint; "local" when omitted
# temperature = 0.2           # forced onto every request; unset leaves the
#                             # server's model default (GLM's is 1.0, which
#                             # leaks CJK tokens into code — docs/NOTES.md)
# max_tokens = 49152          # per-request output cap (shared with the
#                             # model's reasoning); default 49152
# tools_mode = "native"       # tool transport: native (default) · code
#                             # (one run_code tool + a ~4k-token generated
#                             # TypeScript SDK prompt) · both
